<!DOCTYPE html>

<html>
<head>

```
<title>Create Account - Sales Data Analysis</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4f46e5, #7c3aed, #ec4899);
    }

    .register-box {
        width: 420px;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        text-align: center;
    }

    .logo {
        font-size: 50px;
        margin-bottom: 10px;
    }

    h1 {
        margin: 0;
        color: #312e81;
        font-size: 28px;
    }

    .subtitle {
        color: #6b7280;
        margin: 10px 0 30px;
    }

    .input-box {
        text-align: left;
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #374151;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
    }

    button:hover {
        opacity: 0.9;
    }

    .error {
        background: #fee2e2;
        color: #b91c1c;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .login-link {
        margin-top: 20px;
        color: #6b7280;
        font-size: 14px;
    }

    .login-link a {
        color: #4f46e5;
        font-weight: bold;
        text-decoration: none;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    .footer {
        margin-top: 25px;
        color: #9ca3af;
        font-size: 13px;
    }

</style>
```

</head>

<body>

```
<div class="register-box">

    <div class="logo">📊</div>

    <h1>Create Account</h1>

    <p class="subtitle">Register for Sales Data Analysis</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="input-box">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

        </div>

        <div class="input-box">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

        </div>

        <div class="input-box">

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>

        <div class="input-box">

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >

        </div>

        <button type="submit">
            📝 Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">Login</a>
    </div>

    <div class="footer">
        Sales Data Analysis System
    </div>

</div>
```

</body>
</html>
